[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "office-assistant"
version = "0.1.0"
description = "Private internal Telegram AI office assistant foundation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "python-telegram-bot>=21.0,<23.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "pypdf>=5.0,<7.0",
    "qdrant-client>=1.14,<2.0",
    "fastembed>=0.7,<1.0",
    "openai>=3.8,<4.0",
    "httpx>=0.28,<1.0",
    "trafilatura==2.3.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/office_assistant"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a running PostgreSQL instance",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

