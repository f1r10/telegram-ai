name: Unit and static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Run offline unit tests
        run: uv run --no-sync pytest -m "not integration"
      - name: Run Ruff lint
        run: uv run --no-sync ruff check src tests
      - name: Check Ruff formatting
        run: uv run --no-sync ruff format --check src tests
      - name: Run strict Pyright
        run: uv run --no-sync pyright
