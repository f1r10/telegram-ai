name: Unit and static checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Validate opt-in Docker Compose Mini App network isolation
        env:
          POSTGRES_DB: synthetic_test
          POSTGRES_USER: synthetic_test
          POSTGRES_PASSWORD: synthetic-placeholder-never-live
          MINIAPP_ENABLED: "false"
        run: |
          touch .env
          trap 'rm -f .env' EXIT
          docker compose config --format json > /tmp/office-compose-default.json
          docker compose --profile miniapp config --format json > /tmp/office-compose-opt-in.json
          docker compose -f docker-compose.staging.yml config --format json > /tmp/office-compose-staging.json
          docker compose -f docker-compose.staging.yml --profile miniapp config --format json > /tmp/office-compose-staging-miniapp.json
          python - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path("/tmp/office-compose-default.json").read_text())
          staged = json.loads(Path("/tmp/office-compose-opt-in.json").read_text())
          assert "miniapp" not in baseline["services"], "Mini App must be profile-gated"
          service = staged["services"]["miniapp"]
          assert service["profiles"] == ["miniapp"]
          assert service["environment"]["MINIAPP_CONTAINER_BIND"] == "true"
          assert service["environment"]["MINIAPP_ENABLED"] == "false"
          assert service["command"][-1] == "office_assistant.miniapp.server"
          assert len(service["ports"]) == 1
          assert service["ports"][0]["host_ip"] == "127.0.0.1"
          assert str(service["ports"][0]["target"]) == "18791"
          assert all(
              not port.get("host_ip", "").startswith("0.0.0.0")
              for port in service["ports"]
          )
          isolated = json.loads(Path("/tmp/office-compose-staging.json").read_text())
          isolated_with_miniapp = json.loads(
              Path("/tmp/office-compose-staging-miniapp.json").read_text()
          )
          assert isolated["name"] != baseline["name"], "Staging must be a separate Compose project"
          assert "miniapp" not in isolated["services"], "Staging Mini App must be opt-in"
          assert isolated_with_miniapp["services"]["miniapp"]["profiles"] == ["miniapp"]
          assert isolated_with_miniapp["services"]["miniapp"]["environment"]["MINIAPP_ENABLED"] == "false"
          assert isolated_with_miniapp["services"]["miniapp"]["environment"]["MINIAPP_STOCK_ACTIONS_ENABLED"] == "false"
          assert isolated_with_miniapp["services"]["miniapp"]["environment"]["MINIAPP_STOCK_TRANSFER_ENABLED"] == "false"
          assert isolated_with_miniapp["services"]["miniapp"]["environment"]["MINIAPP_STOCK_XLSX_ENABLED"] == "false"
          for component in ("services", "volumes", "networks"):
              old_values = baseline[component]
              new_values = isolated[component]
              for key in old_values.keys() & new_values.keys():
                  if component == "services":
                      old_name = old_values[key].get("container_name")
                      new_name = new_values[key].get("container_name")
                  else:
                      old_name = old_values[key].get("name")
                      new_name = new_values[key].get("name")
                  assert old_name != new_name, (component, key, "legacy collision")
          def published_ports(config):
              return {
                  (entry.get("host_ip"), int(entry["published"]))
                  for service in config["services"].values()
                  for entry in service.get("ports", [])
              }
          assert published_ports(staged).isdisjoint(
              published_ports(isolated_with_miniapp)
          ), "Staging host ports must not collide with legacy Docker project"
          assert all(host == "127.0.0.1" for host, _ in published_ports(isolated_with_miniapp))
          PY
      - name: Run offline unit tests
        run: uv run --no-sync pytest -m "not integration"
      - name: Run Ruff lint
        run: uv run --no-sync ruff check src tests
      - name: Check Ruff formatting
        run: uv run --no-sync ruff format --check src tests
      - name: Run strict Pyright
        run: uv run --no-sync pyright

  postgres-qdrant-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      POSTGRES_DB: office_assistant_test
      POSTGRES_USER: office_test
      POSTGRES_PASSWORD: ci-placeholder-not-a-production-credential
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      QDRANT_URL: http://127.0.0.1:6333
      FILE_STORAGE_PATH: ./var/ci-storage
      TELEGRAM_POLLING_ENABLED: "false"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: office_assistant_test
          POSTGRES_USER: office_test
          POSTGRES_PASSWORD: ci-placeholder-not-a-production-credential
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U office_test -d office_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Verify disposable test database name
        run: |
          test "$POSTGRES_DB" = "office_assistant_test"
          test "$TELEGRAM_POLLING_ENABLED" = "false"
      - name: Check Qdrant is reachable
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:6333/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant test service did not become ready" >&2
          exit 1
      - name: Migrate disposable PostgreSQL schema
        run: uv run --no-sync alembic upgrade head
      - name: Execute PostgreSQL and Qdrant integration tests
        run: uv run --no-sync pytest -m integration -ra
