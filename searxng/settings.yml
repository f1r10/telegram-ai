use_default_settings:
  engines:
    keep_only:
      - google
      - duckduckgo
      # Second DuckDuckGo access path: duckduckgo.com plus its JSON API paging,
      # instead of the html.duckduckgo.com endpoint the `duckduckgo` engine scrapes.
      - duckduckgo web
      - wikipedia

general:
  instance_name: "Office Assistant private search"
  debug: false

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

engines:
  - name: duckduckgo web
    disabled: false

outgoing:
  # Timeout ladder: engine (9s) < SearXNG budget (11s) < the client's 12s
  # (SEARXNG_REQUEST_TIMEOUT_SECONDS). A single engine cannot consume the whole
  # budget, and SearXNG always answers before the client gives up, so a dead
  # engine reaches the adapter as `unresponsive_engines` instead of a client-side
  # timeout the adapter cannot distinguish from an empty index.
  request_timeout: 9.0
  max_request_timeout: 11.0
